{{define "content"}}<main class="grid min-h-screen place-items-center bg-slate-50 p-4"><section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl"><h1 class="text-2xl font-bold">Buat kata sandi baru</h1><p class="mt-2 text-sm text-slate-500">Tautan hanya dapat digunakan sekali dan berlaku selama satu jam.</p>{{if .Content.Error}}<div class="my-4 rounded-xl bg-red-50 p-3 text-sm text-red-700">{{.Content.Error}}</div>{{end}}<form method="post" action="/reset-password" class="mt-6 space-y-4"><input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="token" value="{{.Content.Token}}"><label><span class="form-label">Kata sandi baru</span><input required minlength="8" type="password" name="password" class="form-input" autocomplete="new-password"></label><label><span class="form-label">Konfirmasi kata sandi</span><input required minlength="8" type="password" name="password_confirmation" class="form-input" autocomplete="new-password"></label><button class="btn-primary w-full">Reset Kata Sandi</button></form></section></main>{{end}}
